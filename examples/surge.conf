# Merge these lines into [Rule]; replace PROXY with your existing proxy group.
# Keep existing node/LAN/user exceptions above these lines. One FINAL rule only.
[Rule]
RULE-SET,https://raw.githubusercontent.com/Heibai0502/agent-route/release/surge/private.list,DIRECT,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/Heibai0502/agent-route/release/surge/reject.list,REJECT,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/Heibai0502/agent-route/release/surge/proxy.list,PROXY,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/Heibai0502/agent-route/release/surge/direct.list,DIRECT,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/Heibai0502/agent-route/release/surge/cn-ip.list,DIRECT,update-interval=86400
FINAL,PROXY,dns-failed
